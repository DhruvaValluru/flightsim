# The platform story as a MEASUREMENT, not a claim: the headless half
# (compiler, physics, telemetry, webapp, planners) must stay green on all
# three OSes on every push. No UE on CI -- mac-only render coverage skips
# visibly under the shared mac_ue marker / artifact-existence checks.
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The suite takes minutes; an hour is a hang, and a capped job
    # publishes its log where a six-hour default never does.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          # No LLM keys on CI: llm_available() still reports True (the
          # zero-config relay default) but no test calls the network --
          # the suite injects mock clients everywhere.
          FLIGHTSIM_LLM: none
      # A campaign test that failed or hung leaves the capture command's
      # stdout under pytest's temp root, one capture.log per run; a job
      # that fails prints the tail of the newest ones so its log says
      # what the child process said (the Windows deadlock of run
      # 36217163564 took a cycle to see without this).
      - name: capture logs of the runs the failed suite made
        if: failure()
        shell: python
        run: |
          import tempfile
          import time
          from pathlib import Path

          root = Path(tempfile.gettempdir())
          logs = {p.resolve() for p in root.glob("pytest-of-*/pytest-*/**/capture.log")}
          logs = sorted(logs, key=lambda p: p.stat().st_mtime, reverse=True)[:12]
          if not logs:
              print(f"no capture.log under {root}")
          for path in logs:
              lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
              when = time.strftime("%H:%M:%S", time.gmtime(path.stat().st_mtime))
              print(f"== {path} ({len(lines)} lines, last written {when} UTC)")
              print("\n".join(lines[-40:]))
