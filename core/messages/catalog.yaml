# -- the DIS entity-state feed (core/interop/dis.py, flightsim/dis.py) ------

interop.dis.run:
  sentence: "That folder holds no recorded flight, so no entity-state stream can be written from it."
  hint: "Point at a run folder written by the capture command; it holds the recorded flight."
interop.dis.channels:
  sentence: "The recorded flight carries no position or attitude columns, so its state cannot be put into the standard form."
  hint: "Capture the run again with this build; older recordings did not sample latitude and longitude."
interop.dis.airframe:
  sentence: "That aircraft has no entry in the entity-type table, so its kind cannot be stated in the standard form."
  hint: "Choose one of the tabulated aircraft, or add a row for it with its enumeration."
interop.dis.entity_id:
  sentence: "An entity identifier has to fit in sixteen bits (0 to 65535) and an exercise identifier in eight (0 to 255)."
interop.dis.stream:
  sentence: "That file is not a stream of whole entity-state messages of the version this build reads."
  hint: "Give a file written by the feed command; a truncated or foreign file is refused rather than read part-way."
interop.dis.arguments:
