# -- limit monitoring (core/telemetry/limits.py) --------------------------------

limits.config:
  sentence: "This aircraft's limit table is malformed, so its flight cannot be checked against its envelope."
  hint: "Correct the aircraft's limit table: every limit is a number with its source, or left empty with the reason."

# -- modal analysis (core/fdm/linearize.py, core/fdm/modes.py, flightsim/modes.py) ------

modes.untrimmed:
  sentence: "The aircraft has not been trimmed, so there is no steady flight condition whose small motions can be analysed."
  hint: "Trim the aircraft first; the modal analysis describes small motions about a steady condition."
modes.linearization:
  sentence: "The flight model could not be linearised about this condition."
  hint: "The installed JSBSim must provide its linearisation and the model must carry the eight classical states (speed, angle of attack, pitch attitude and rate; sideslip, bank, roll rate, yaw rate)."
modes.residual:
  sentence: "The linear model does not reproduce the flight model's own accelerations closely enough to be trusted, so no modes are reported for this condition."
  hint: "An independent check of the linearisation differs from it beyond the stated bound; the condition may sit on a table breakpoint of the flight model."
modes.airframe_class:
  sentence: "No handling-qualities class is stated for this aircraft, so its modes cannot be graded against the bands."
  hint: "State the aircraft's MIL-F-8785C class in the modal analysis table; a class is never guessed."

# -- the verifier clauses of batch 1 (datum, instruments) ------------------------
scene.datum:
  sentence: "The recorded height of sea level above the Earth's ellipsoid at the scene origin does not agree with the checker's own reading of the same geoid grid."
check.datum:
  sentence: "The scene's vertical datum block names its geoid grid and states the sea-level offset the checker re-measures from it."
check.instruments:
  sentence: "Every measured channel's errors match the instrument profile it claims, with this run's own recording beside it."
labels.pass_material:
  sentence: "The material a ground-truth pass renders through is not in the project, so that pass cannot be written."
  hint: "Run the material script in the editor once to create it."
labels.pass_unknown:
  sentence: "A requested ground-truth pass is not one this build writes."
  hint: "Ask for normal, velocity or albedo."
labels.pass_needs_labels:
  sentence: "The ground-truth passes ride the label passes and were asked for without them."
  hint: "Ask for the labels too."
annotation.normals:
  sentence: "The surface normals disagree with the surface the measured distances show."
annotation.flow:
  sentence: "The motion vectors at the aircraft disagree with how far it moved between frames."
annotation.albedo:
  sentence: "The base colour image is missing, out of range, or is the lit picture itself."
check.normals_vs_depth:
  sentence: "The surface normals agree with the surface the measured distances show."
check.flow_vs_motion:
  sentence: "The motion vectors at the aircraft agree with how far it moved between frames."
check.albedo_range:
  sentence: "The base colour image is present, in range, and not the lit picture."

