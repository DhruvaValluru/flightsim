# -- the variable registry (core/registry.py, core/scenario/validate.py) ------

record.unregistered:
  sentence: "The scenario states a setting that no registered variable returns a record for, so its effect could not be measured or traced."
  hint: "Register the variable with its unit, its off value and the channels it moves, or remove the setting."
record.null_value:
  sentence: "This variable has no off value to compare against, so the with-and-without flight cannot be run for it."
  hint: "State the value that means off for it, or ask for a value other than that one."
record.effect_channel:
  sentence: "This variable names no recorded channel it could have moved, so its effect cannot be measured."
  hint: "Register the channel the variable moves, and record it."
record.effect_channel_unit:
  sentence: "A channel this variable moves has no unit, or a unit that contradicts its name, so its effect could not be stated."
  hint: "Give the channel the unit its name says."

# -- the non-standard atmosphere (core/environment/atmosphere.py) -------------

atmosphere.temperature_deviation:
  sentence: "The temperature deviation from the standard day has to lie between 60 degrees colder and 45 degrees hotter; {actual} is outside that."
  hint: "Ask for a day between 60 degrees colder and 45 degrees hotter than standard, or use one of the day words."
atmosphere.sea_level_pressure:
  sentence: "A sea-level pressure has to lie between 870 and 1085 hectopascals, the recorded extremes; {actual} is outside that."
  hint: "Ask for a pressure between 870 and 1085 hectopascals."
atmosphere.dew_point:
  sentence: "The air's moisture cannot be set up as asked: the dew point cannot be above the air temperature where the flight starts, the humidity has to lie between 0 and 100 percent, and the model admits only so much water vapour at that height."
  hint: "Lower the dew point or the humidity, or choose a warmer day; the simulation would otherwise cap the moisture silently."
atmosphere.humidity_conflict:
  sentence: "A dew point and a relative humidity were both stated; they are one quantity said two ways."
  hint: "State one of the two."
atmosphere.profile:
  sentence: "That kind of day is not one this build can set up; the named climatic profiles have not been transcribed with their sources."
  hint: "Choose one of the day words (a standard day, standard plus 15 or 20 degrees, a hot day, a cold day, a humid day), or state the numbers."

# -- the advancement additions, batch1 -----------------------------------
derivation.anchor_missing:
  sentence: "The stock flight model has no place, or no single place, where this addition hooks in, so it was not built rather than guessed at."
  hint: "Choose an aircraft whose flight model carries the three control inputs, the lift table against angle of attack and one roll-damping term in the usual form, or leave that addition out."
derivation.injection_conflict:
  sentence: "That set of additions cannot be built together: one is unknown, one is repeated, none was chosen, or the flight model already carries what an addition would add."
  hint: "Select each addition once from the known ones, and start from the stock flight model, not from one that was already derived."
derivation.hash_mismatch:
  sentence: "The generated flight model on disk is not the one that was recorded, so it will not be flown under that record."
  hint: "Regenerate the derived flight model; never edit the generated copy."
geoid.grid_missing:
  sentence: "The EGM2008 geoid grid is not in the fetched-data cache, so heights cannot be related to the ellipsoid with the geoid model the terrain was made with."
  hint: "Fetch the recorded GeographicLib tarball into the cache, or prepare the terrain with the committed EGM96 grid and accept the stated difference."
geoid.grid_digest:
  sentence: "The fetched geoid grid, or the tarball it came in, is not the one this build was measured with."
  hint: "Fetch the recorded tarball again; a grid with another digest is refused, not interpolated."
datum.outside_grid:
  sentence: "The point or the scene lies outside the geoid grid's coverage, so no sea-level offset can be interpolated for it."
  hint: "Keep the flight inside the prepared scene, or prepare a scene that covers it; a crop that would reach beyond the poles cannot be cut."
datum.sidecar_without_datum:
  sentence: "The prepared terrain names a real place but carries no vertical datum block, so the run cannot say which geoid its heights are on."
  hint: "Prepare the terrain again with the current bake; a datum is never worked out on the fly for a flight."
datum.model_mismatch:
  sentence: "The scenario declares a geoid model that is not the one the prepared terrain carries, or one this build does not know."
  hint: "Declare the model the terrain was prepared with (or none), or prepare the terrain again with the declared one."
datum.physics_frame_unsupported:
  sentence: "Heights above the ellipsoid, or flying the physics on the ellipsoid, are not supported: the flight model flies heights above the geoid and the offset is applied where a position leaves the simulation."
  hint: "State heights above the geoid and the matching physics frame, or leave the datum block out."
dted.metadata_incomplete:
  sentence: "The prepared terrain cannot fill in its DTED-style metadata because its record lacks the origin, the extent, the source tiles, the datum or the verification."
  hint: "Prepare the terrain again with the current bake, which records all of them."
check.datum_independent:
  sentence: "An independent map-projection library re-measures the sea-level offset from the crop of the geoid grid written beside the prepared terrain, at the origin and a hundred points inside it, and finds nothing outside the crop."

# Placement: the seven refusal names beside terrain.geoid under "terrain and weather"; check.datum_independent beside check.datum under "the verifier clauses of batch 1". No new FAIL name: datum_independent fails as scene.datum (its sentence already says the offset disagrees with the checker's own reading). Trialled: tests/test_messages.py's uncovered set is exactly these seven names plus three derivation.* names from the other item's working tree.

# -- the advancement additions, batch1 -----------------------------------
landcover.legend:
  sentence: "A land cover code outside the map's legend has no class in the scene's taxonomy."
  hint: "Rebuild the land cover from the ESA WorldCover map; a code the legend does not carry is refused, never guessed into a class."
landcover.surface_inference:
  sentence: "No single kind of ground covers enough of this scene for its roughness to be inferred from the land cover."
  hint: "State the ground cover in the scenario (grassland, desert, ocean, forest, city, snow or bare), or fly a scene where one kind covers at least half of it."
terrain.landscape_layout:
  sentence: "A land cover layer is laid out for a different landscape size than the height map."
  hint: "Export the layers and the height map together from the same prepared terrain; a layer of another size would be resampled silently by the editor."
terrain.landscape_missing:
  sentence: "The prepared terrain carries no vertical datum, so a landscape import cannot state the datum of its heights."
  hint: "Prepare the terrain again with the current bake so its sidecar carries the datum block, then export the landscape."
terrain.landscape_stale:
  sentence: "The prepared terrain or one of its land cover layers no longer matches what the landscape import recorded."
  hint: "Export the landscape again from the current prepared terrain; a landscape built from another bake is refused rather than imported."
turbulence.model:
  sentence: "The turbulence model asked for cannot be delivered: the model is unknown, the intensity is neither a known word nor a wind speed at 20 ft, a numbered intensity was given to the Dryden model, or the seed is not a whole number the simulation can represent."
  hint: "Choose the Dryden or the von Karman model; give the intensity as light, moderate, severe or none, or as a 20-ft wind speed in knots with the von Karman model; keep the seed a whole number below 2147483647."
wind_profile.kind:
  sentence: "The wind profile asked for cannot be flown: its kind is unknown, the MIL-F-8785C shear law was asked for outside 3 to 1000 ft above ground or with a roughness length other than its two stated values, or another kind's setting was stated beside it."
  hint: "Choose uniform, layered, milspec or nwp; start a milspec flight between 3 and 1000 ft above ground with a roughness of 0.15 or 2.0 ft; state one profile's settings at a time."
wind_profile.layers:
  sentence: "The wind layers are not a profile: a layered wind needs at least two layers of height, speed and direction, in rising order of height, with no negative height or speed and directions within a compass turn."
  hint: "List the layers from the lowest height upward, each as height in metres, speed in knots and the direction the wind blows from in degrees."
weather.fixture_missing:
  sentence: "No cached weather profile of that name is on hand, so the flight cannot use it; nothing is fetched during a run."
  hint: "Name a profile whose data and provenance files are both cached under the weather fixtures directory, or choose another wind profile kind."
weather.fixture_digest:
  sentence: "The cached weather profile does not match the digest its provenance file records, so it is not the profile that was cached."
  hint: "Restore the cached profile from its source, or refresh both files together."
card.gust_table:
  sentence: "The run card's gust table is malformed: a key is missing or out of order, a row is not five numbers, or the digest of the rows does not match, so the host applies no gust."
  hint: "Regenerate the card from the scenario; the table is written by the scenario tools, never by hand."
gust_table.length:
  sentence: "The run card's gust table does not have one row per simulation step of the flight it is for, so the host cannot apply it step for step."
  hint: "Regenerate the card with the same duration and rate as the flight."
card.layered_wind:
  sentence: "The run card's wind profile block is malformed: a key is missing or out of order, or a layer is not a height, a speed and a direction, so the host applies no profile."
  hint: "Regenerate the card from the scenario."

# -- the advancement additions, batch1 -----------------------------------
loading.config:
  sentence: "This aircraft's loading table is missing, malformed, or not the flight model's own, so a loading cannot be set up for it."
  hint: "Give the aircraft a loading table transcribed from its flight model: the empty weight, each station with its arm and its maximum, each tank with its capacity, every number with its source."
loading.station_unknown:
  sentence: "There is no payload station of that name on this aircraft, or that station cannot be loaded, so the mass has nowhere to go."
  hint: "Name one of the aircraft's loadable stations."
loading.station_mass:
  sentence: "A mass of {actual} {unit} at a station is negative or over that station's maximum of {limit} {unit}."
  hint: "Ask for a mass between zero and the station's maximum."
loading.fuel_range:
  sentence: "The fuel load cannot be set up as asked: it has to be more than zero and no more than the tanks hold, a fraction has to lie between 0 and 1, and the fuel is stated either as a mass or as a fraction, not both."
  hint: "Ask for a fuel mass the tanks can hold, or a fraction of their capacity between 0 and 1."
loading.max_weight:
  sentence: "The loaded aircraft would weigh {actual} {unit}, more than its maximum takeoff weight of {limit} {unit}."
  hint: "Lighten the payload or the fuel."
loading.cg_envelope:
  sentence: "With that loading the centre of gravity ({actual} inches aft of the reference point) lies outside the aircraft's balance envelope."
  hint: "Move mass forward or aft, or lighten the load; the envelope and the arms it is checked against come from the handbook and are marked unverified."
loading.datum_unverified:
  sentence: "The balance envelope cannot be checked for this aircraft: its flight model's stations have not been matched to the handbook's reference point, so the loading is flown at the model's own arms and no envelope is claimed."
  hint: "The check runs only for an aircraft whose station arms were compared with the handbook's; the loading itself is not refused."
card.loading_properties:
  sentence: "The run card's loading block is malformed, or the centre of gravity read back after the writes is not the expected one, so the host applies no loading."
  hint: "Regenerate the card from the scenario; the block is written by the scenario tools, never by hand."
failures.kind:
  sentence: "A scheduled failure names a kind this build does not model, or is not written as a kind, a target, a time and a value, so nothing was scheduled."
  hint: "Choose an engine out, a control jam, a hardover, a float or an authority loss, and write each event as those four parts."
failures.target:
  sentence: "A scheduled failure names a surface or an engine this aircraft does not have, so it could not be applied to anything."
  hint: "Name the elevator, the aileron or the rudder for a control failure, or an engine number the aircraft has for an engine out."
failures.time:
  sentence: "A scheduled failure's time is not usable: it is negative, later than the end of the flight, not a number, or the events are not in time order."
  hint: "Give each event a time within the flight, in seconds from its start, and list the events in order."
failures.actuator_missing:
  sentence: "A control failure was asked for on an aircraft whose flight model carries no failure chain for that surface, so it would have gone nowhere."
  hint: "Choose an aircraft whose flight model can carry the control failure chain, or schedule an engine out instead."
failures.value:
  sentence: "The remaining authority of a control has to be a number between 0 and 1 (not {actual}), and only an authority loss takes a value."
  hint: "State the remaining authority between 0 and 1 for an authority loss, and no value for the other kinds."
card.failure_schedule:
  sentence: "The run card's failure schedule is malformed: a key is missing or out of order, an event is not a kind, a target, a time, a property and a value, or the count does not match, so the host applies no failure."
  hint: "Regenerate the card from the scenario; the schedule is written by the scenario tools, never by hand."

# -- the advancement additions, batch1 -----------------------------------
icing.severity:
  sentence: "The icing severity word is not one this build maps: the words are trace, light, moderate and severe, each a stated fraction of the iced-coefficient scale, not a pilot report."
  hint: "Choose trace, light, moderate or severe, or state the severity as a number between 0 and 1."
icing.eta_range:
  sentence: "The icing schedule cannot be delivered as asked: the severity has to be a number between 0 and 1 (not {actual}), the onset and the ramp cannot be negative, and the stall-onset shift has to be a number within ten degrees of zero."
  hint: "Keep the severity in 0..1, the onset and ramp at or above zero seconds, and the stall-onset shift within its stated bound."
icing.envelope:
  sentence: "The icing envelope named is not one this build records: only the Part 25 Appendix C and Appendix O words are accepted, and they are recorded as a note, never applied."
  hint: "Name the Appendix C or Appendix O envelope, or leave it out."
icing.airframe_data:
  sentence: "No icing coefficient table is configured for this aircraft, so an iced flight of it would be a guess rather than a proxy; the Twin Otter set is the Twin Otter's, and the Cessna carries it as a named proxy."
  hint: "Choose the Twin Otter or the Cessna, or give the aircraft a coefficient table with its sources."
card.icing_schedule:
  sentence: "The run card's icing schedule is malformed: a key is missing or out of order, or the coefficient table is not six numbers, so the host ices nothing."
  hint: "Regenerate the card from the scenario; the schedule is written by the scenario tools, never by hand."
dis.entity_type_unknown:
  sentence: "The standard's entity-type numbers for that aircraft have not been entered in the entity-type table, so the stream cannot state what kind of entity it is."
  hint: "Enter the seven numbers from the cited edition of the enumeration standard into the table's row, or ask for the remembered fallback row (marked unverified) or for the unspecified type."
dis.marking_too_long:
  sentence: "An entity marking has to be at most eleven plain ASCII characters; that one is longer or carries another character."
  hint: "Shorten the marking to eleven ASCII characters, or leave it out and the aircraft's name is used."
dis.frame_without_geodetic:
  sentence: "A recorded sample has no latitude, longitude or height, so no entity-state message can be written for it."
  hint: "Capture the run again with this build; every sample must carry a finite geodetic place before it can be put on the wire."
dis.timestamp_epoch_missing:
  sentence: "Absolute timestamps were asked for without the instant that simulation time zero corresponds to."
  hint: "State the epoch as a UTC instant (for example 2026-09-29T10:00:00Z), or use relative timestamps."
dis.timestamp_mode:
  sentence: "The timestamp mode has to be relative or absolute."
  hint: "Choose relative (simulation time past the hour) or absolute (a stated epoch plus the sample time)."
dis.force_id:
  sentence: "The force identifier has to be a whole number between 0 and 255."
  hint: "Use 0 for no side, or the enumeration's value for the side the entity is on."
dis.udp_in_campaign:
  sentence: "A campaign case writes the entity-state stream to a file and never sends it on a network."
  hint: "Run the capture on its own to send datagrams; a campaign is reproducible batch work, not an exercise."
interop.cigi_not_implemented:
  sentence: "No image-generator session over the CIGI interface exists in this build; the run card is the documented offline interface to the image generator."
  hint: "Use the run card and the render command; a live CIGI session is not available."
interop.hla_not_implemented:
  sentence: "No HLA federation and no reference federation object model exists in this build."
  hint: "Use the entity-state stream, which is the interoperability product this build offers."
check.dis_roundtrip:
  sentence: "The entity-state stream is read back by the checker's own reading of the standard's message layout: every message's position agrees with an independent map-projection library's conversion of the recorded place, its attitude with the checker's own composition of the recorded heading, pitch and roll, and its clock never runs backwards."

# -- the advancement additions, batch1 -----------------------------------
wake.generator:
  sentence: "The generating aircraft for the wake has to be one of the configured aircraft whose flight model states a weight and a wingspan; that one is not, so the strength of its vortex pair cannot be computed."
  hint: "Name one of the configured aircraft as the generator, or leave the wake out."
wake.geometry:
  sentence: "The wake encounter's geometry is incomplete or not a number: the offsets and the generator's speed are numbers, and exactly one of the separation time and the held age says how old the wake is, never both, never negative."
  hint: "State the sideways and vertical offsets in metres and either the separation in seconds or the held age in seconds."
wake.model:
  sentence: "The wake's decay model has to be either none (the initial circulation held) or the named decay model with declared inputs; that word is neither."
  hint: "Choose none or the named decay model."
wake.decay:
  sentence: "The named decay model needs its non-dimensional dissipation rate above zero and at most one, and a stratification frequency between zero and one when stated; that input is missing or out of range."
  hint: "Declare the dissipation rate in its range, and the stratification frequency if it is meant, or choose no decay."
card.wake:
  sentence: "The run card's wake block is malformed: a key is missing or out of order, or the five selftest vectors do not reproduce in the host's port of the field, so the host places no wake."
  hint: "Regenerate the card from the scenario; the block is written by the scenario tools, never by hand."
check.wake_selftest:
  sentence: "The run card's wake selftest vectors are re-evaluated by the checker's own reading of the vortex-pair profile and the strip-theory integral, and, where a render host wrote its own, those against the card's."

# Placement: the four wake.* names beside the icing.* entries under the advancement additions (after card.icing_schedule's hint); card.wake beside card.icing_schedule (ALLOWED_FUTURE until P9, patch below); check.wake_selftest beside check.dis_roundtrip (live once the verify.py patch lands: FAIL_WAKE = "check.wake_selftest" is the emitter, so the catalogue entry and the verifier patch land in one commit). Measured on the patched copy with these six appended: tests/test_messages.py's uncovered set is exactly S1's six sensing.* names; every sentence passes the identifier regex and ends as a sentence.
sensing.radiometry:
  sentence: "The luminance chain cannot be formed: a spectral table it needs is absent or altered, or a lens attenuation is not a fraction of the light passed."
  hint: "Run the table fetch script named in the message, or state a lens attenuation between zero and one."
sensing.band:
  sentence: "The band file cannot be used: it is absent, does not declare itself a proxy, or names a band or a channel the tables cannot integrate."
  hint: "Name a band file that exists under the sensor bands folder and declares itself a proxy."
sensing.optics:
  sentence: "The optics block cannot be applied: an unknown model, a non-positive wavelength or f-number, a negative aberration width, or an even kernel support."
  hint: "State the diffraction model with a positive wavelength and f-number and an odd support."
sensing.motion_blur:
  sentence: "The motion blur block cannot be applied: an unknown model, a non-positive flow interval, or a streak too long to integrate."
  hint: "State the velocity-line model with a positive flow interval."
sensing.sun_lux:
  sentence: "A sun of {actual} lux cannot be lit: it must be a positive number no brighter than the {limit} lux of the sun above the atmosphere."
  hint: "State a sun between one lux and the extraterrestrial illuminance, or leave it unstated."
sensing.exposure_units:
  sentence: "The engine's sun is not set in lux while the exposure is a manual value that expects lux, so the picture's luminance means nothing: an eighteen percent grey card would render black."
  hint: "Render with the sun in physical units before reading luminance off the frames."
annotation.psf:
  sentence: "The point spread measured on the calibration edge disagrees with the kernel the manifest says was applied."
annotation.blur:
  sentence: "The motion streak recorded for a frame disagrees with the streak the flow pass predicts over the exposure."
annotation.radiometry:
  sentence: "The grey card the engine rendered disagrees with the luminance the calibration chain predicted."
check.psf_slanted_edge:
  sentence: "The point spread applied to the frames is measured by the checker's own slanted-edge method on the calibration edge and agrees with the manifest's predicted resolution."
check.blur_vs_flow:
  sentence: "The motion streak recorded for each frame agrees with the streak the flow pass predicts over the exposure."
check.radiometry_grey_card:
  sentence: "The grey card the engine rendered agrees with the luminance the calibration chain predicted."
