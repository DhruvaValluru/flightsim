# The SAME flight as cameras_multi.yaml (its name and every non-camera
# field identical, so the simulation digest -- the spec with its cameras
# removed -- is the same) captured with a DIFFERENT camera set: one
# over-the-shoulder cockpit view, EXACTLY 24 images on the shared
# telemetry clock. The pair is the temporal-alignment check's committed
# exercise: two runs, two camera sets, frame sets that align
# instant-for-instant. Runs on any platform, no engine needed:
#   .venv/bin/python -m flightsim.capture examples/cameras_multi.yaml --out runs/demo
#   .venv/bin/python -m flightsim.capture examples/cameras_multi_cockpit.yaml --out runs/demo_b
#   .venv/bin/python -m flightsim.verify runs/demo_b --against runs/demo
# Expected: temporal_alignment PASS, "24 instants in both runs; worst
# gap 0 s", exit 0 (verified). docs/CAMERA_PHASE1_REPORT.md shows the
# output verbatim.
spec_version: 6
name: cameras_multi
aircraft:
  aircraft:
    value: B747
    source: user
    from: '747'
initial:
  altitude:
    value: 3048.0
    unit: m
    source: user
    from: 10000 ft
  airspeed:
    value: 280.0
    unit: kt
    source: user
    from: 280 kt
  airspeed_kind:
    value: cas
    source: user
    from: assumed calibrated
  heading:
    value: 0.0
    unit: deg
    source: default
    from: due north
  latitude:
    value: 0.0
    unit: deg
    source: default
    from: equator; no geography requested
  longitude:
    value: 0.0
    unit: deg
    source: default
    from: prime meridian
  terrain_elevation:
