    value: 90.0
    unit: s
    source: user
    from: 90 s
  rate:
    value: 120.0
    unit: Hz
    source: default
    from: matches the UE plugin substep rate
  seed:
    value: 0
    unit: dimensionless
    source: default
    from: deterministic; no stochastic subsystem active yet
  mass_held:
    value: false
    source: default
    from: realistic fuel burn
  hold_state:
    value: false
    source: user
    from: 'open loop: this example records the trimmed drift'
