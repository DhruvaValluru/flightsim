# Waypoint capture over REAL TERRAIN, with no network and no account.
#
# The raster is synthesised (spectral construction + thermal and
# hydraulic erosion, core/terrain/synthesis.py), deterministic from its
# seed, and CENTRED on this spec's own origin -- so the flight is
# genuinely over it and the camera checks are against a raster rather
# than against a flat datum. It reaches the ground callback as the same
# Heightfield a Copernicus bake produces; --terrain over a real bake
# stays the path for real geography.
#
# Two cameras, two triggers:
#   chase     -- the waypoint trigger: one frame each 1500 m of FLOWN
#                ground track (drift and turns lengthen it as flown);
#   ridgetop  -- a camera stated in scene metres on the ridge shoulder,
#                aimed at the aircraft through an 85 mm short telephoto,
#                capturing EXACTLY 20 images.
#
#   .venv/bin/python -m flightsim.capture examples/cameras_terrain.yaml \
#       --out runs/terrain --synth-terrain
#   .venv/bin/python -m flightsim.verify runs/terrain
#
# Expected: 30 frames, verification 8/8 PASS, and the pixel render
# refused by name (ue.platform) off a render-capable machine.
spec_version: 7
name: cameras_terrain
aircraft:
  aircraft:
    value: B747
    source: user
    from: '747'
initial:
