# Waypoint capture: one frame each 400 m of the FLOWN ground track
# (projected through the scene frame -- drift and turns lengthen it
# exactly as flown). Open loop (hold_state false): the run records the
# trimmed aircraft's own drift. Flat scene by default; over a real
# bake, pass the raster so the physics ground and the camera checks
# use it:
#   .venv/bin/python -m flightsim.capture examples/cameras_waypoint.yaml \
#       --out runs/waypoint [--terrain runs/terrain/matterhorn]
spec_version: 6
name: cameras_waypoint
aircraft:
  aircraft:
    value: c172p
    source: user
    from: cessna
initial:
  altitude:
    value: 1200.0
    unit: m
    source: user
    from: 1200 m
  airspeed:
    value: 100.0
    unit: kt
    source: user
    from: 100 kt
  airspeed_kind:
    value: cas
    source: user
    from: assumed calibrated
  heading:
    value: 0.0
    unit: deg
    source: default
    from: due north
  latitude:
    value: 0.0
    unit: deg
    source: default
    from: equator; no geography requested
  longitude:
    value: 0.0
    unit: deg
    source: default
    from: prime meridian
  terrain_elevation:
    value: 0.0
    unit: m
    source: default
    from: flat terrain at sea level
environment:
  wind_speed:
    value: 0.0
    unit: kt
    source: default
    from: still air
  wind_direction:
    value: 0.0
    unit: deg
    source: default
    from: still air
  turbulence:
    value: none
    source: default
    from: smooth air
    std: MIL-F-8785C Fig.7 (W20, wind speed at 20 ft AGL)
    W20_kt: 0.0
  surface:
    value: unspecified
    source: default
    from: no ground cover stated; no surface coupling
  weather_date:
    value: none
    source: default
    from: no date stated; spec wind as given
  weather_event:
    value: none
    source: default
    from: no severe weather requested
run:
  duration:
    value: 30.0
    unit: s
    source: user
    from: for 30 seconds
  rate:
    value: 120.0
    unit: Hz
    source: default
    from: matches the UE plugin substep rate
  seed:
    value: 0
    unit: dimensionless
    source: default
    from: deterministic; no stochastic subsystem active yet
  mass_held:
    value: false
    source: default
    from: realistic fuel burn
  hold_state:
    value: false
    source: user
    from: 'open loop: this example records the trimmed drift'
cameras:
- camera_id:
    value: survey
    source: default
    from: documented camera default
  preset:
    value: chase
    source: default
    from: documented camera default
  position_mode:
    value: offset
    source: default
    from: documented camera default
  offset_forward_m:
    value: -28.0
    unit: m
    source: default
    from: per-airframe chase offset table
  offset_right_m:
    value: 0.0
    unit: m
    source: default
    from: per-airframe chase offset table
  offset_up_m:
    value: 4.0
    unit: m
    source: default
    from: per-airframe chase offset table
  position_north_m:
    value: 0.0
    unit: m
    source: default
    from: documented camera default
  position_east_m:
    value: 0.0
    unit: m
    source: default
    from: documented camera default
  position_lat_deg:
    value: 0.0
    unit: deg
    source: default
    from: documented camera default
  position_lon_deg:
    value: 0.0
    unit: deg
    source: default
    from: documented camera default
  position_alt_m:
    value: 0.0
    unit: m
    source: default
    from: documented camera default
  aim_mode:
    value: aircraft
    source: default
    from: documented camera default
  aim_north_m:
    value: 0.0
    unit: m
    source: default
    from: documented camera default
  aim_east_m:
    value: 0.0
    unit: m
    source: default
    from: documented camera default
  aim_alt_m:
    value: 0.0
    unit: m
    source: default
    from: documented camera default
  aim_bearing_deg:
    value: 0.0
    unit: deg
    source: default
    from: documented camera default
  aim_elevation_deg:
    value: 0.0
    unit: deg
    source: default
    from: documented camera default
  focal_length_mm:
    value: 35.0
    unit: mm
    source: default
    from: documented camera default
  sensor_width_mm:
    value: 36.0
    unit: mm
    source: default
    from: documented camera default
  sensor_height_mm:
    value: 20.25
    unit: mm
    source: default
    from: documented camera default
  width_px:
    value: 1280
    unit: px
    source: default
    from: documented camera default
  height_px:
    value: 720
    unit: px
    source: default
    from: documented camera default
  near_m:
    value: 0.1
    unit: m
    source: default
    from: documented camera default
  far_m:
    value: 100000.0
    unit: m
    source: default
    from: documented camera default
  trigger:
    value: distance
    source: user
    from: 'example: waypoint capture'
  capture_count:
    value: 0
    unit: dimensionless
    source: default
    from: 0 = no counted capture; the clip convention (frames at the render fps)
  period_s:
    value: 1.0
    unit: s
    source: default
    from: documented camera default
  distance_m:
    value: 400.0
    unit: m
    source: user
    from: 'example: one frame each 400 m flown'
  event_channel:
    value: roll_deg
    source: default
    from: documented camera default
  event_threshold:
    value: 30.0
    source: default
    from: documented camera default
  event_direction:
    value: above
    source: default
    from: documented camera default
  refractory_s:
    value: 2.0
    unit: s
    source: default
    from: one event is one capture
  moves: []
