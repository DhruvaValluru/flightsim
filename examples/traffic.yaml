# Two scripted traffic aircraft beside the primary (spec 8 traffic[]):
# an A320 crossing ahead at the documented 400 m and a c172p in
# formation 250 m abeam, both flown as scripted tracks over the
# primary's recorded flight (core/capture/poses.py solve_traffic_track).
# The headless capture writes one object record per aircraft in every
# frame's labels (primary, two traffic, terrain), and the run card and
# manifest carry each traffic track's digest. Rendering refuses by name
# (ue.platform) on a machine without the Windows host, or
# aircraft.mesh for a traffic airframe whose model is not imported:
#   .venv/bin/python -m flightsim.capture examples/traffic.yaml --out runs/traffic
#   .venv/bin/python -m flightsim.verify runs/traffic
spec_version: 9
name: traffic
aircraft:
  aircraft:
    value: B747
    source: user
    from: '747'
initial:
  altitude:
    value: 3048.0
    unit: m
    source: user
    from: 10000 ft
  airspeed:
    value: 280.0
    unit: kt
    source: user
    from: 280 kt
  airspeed_kind:
    value: cas
    source: user
    from: assumed calibrated
  heading:
    value: 0.0
    unit: deg
    source: default
    from: due north
  latitude:
    value: 0.0
    unit: deg
    source: default
    from: equator; no geography requested
  longitude:
    value: 0.0
    unit: deg
    source: default
    from: prime meridian
  terrain_elevation:
    value: 0.0
    unit: m
    source: default
    from: flat terrain at sea level
environment:
  wind_speed:
    value: 0.0
    unit: kt
    source: default
    from: still air
  wind_direction:
    value: 0.0
    unit: deg
    source: default
    from: still air
  turbulence:
    value: none
    source: default
    from: smooth air
    std: MIL-F-8785C Fig.7 (W20, wind speed at 20 ft AGL)
    W20_kt: 0.0
  surface:
    value: unspecified
    source: default
    from: no ground cover stated; no surface coupling
  weather_date:
    value: none
    source: default
    from: no date stated; spec wind as given
  weather_event:
    value: none
    source: default
    from: no severe weather requested
run:
  duration:
    value: 12.0
    unit: s
    source: user
    from: for 12 seconds
  rate:
    value: 120.0
    unit: Hz
    source: default
    from: matches the UE plugin substep rate
  seed:
    value: 0
    unit: dimensionless
    source: default
    from: deterministic; no stochastic subsystem active yet
  mass_held:
    value: false
    source: default
    from: realistic fuel burn
  hold_state:
    value: true
    source: default
    from: hold the commanded state
