  offset_right_m:
    value: 0.0
    unit: m
    source: default
    from: per-airframe chase offset table
  offset_up_m:
    value: 12.0
    unit: m
    source: default
    from: per-airframe chase offset table
  position_north_m:
    value: 0.0
    unit: m
    source: default
    from: documented camera default
  position_east_m:
    value: 0.0
    unit: m
    source: default
    from: documented camera default
  position_lat_deg:
