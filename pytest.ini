[pytest]
testpaths = tests
addopts = -q -m "not gate"
markers =
    gate: Phase 3 definition-of-done tests (tests/test_phase3_gates.py); excluded by default, run with -m gate_<L>
    gate_A: letter A done
    gate_B: letter B done
    gate_C: letter C done
    gate_D: letter D done
    gate_E: letter E done
    gate_F: letter F done
# Per-test ceiling (pytest-timeout): the whole suite runs in minutes, the
# slowest single test in tens of seconds; a test that reaches this is hung
# and is failed with the stacks of every thread, so CI shows WHERE.
timeout = 900
