    from: the sink rate the downburst imposes
  event_threshold:
    value: -10.0
    source: user
    from: '10 m/s down: well past the still-air drift, inside the downburst'
  event_direction:
    value: below
    source: user
    from: while sinking faster than the threshold
  refractory_s:
    value: 1.0
    unit: s
    source: user
    from: one capture per second while the condition holds
  profile:
    value: ideal_pinhole
    source: default
    from: the documented ideal pinhole; the engine's frames are the sensor frames
  moves: []
