# The event-driven capture the phase asks for: frames are taken WHEN
# something happens in the flight, not on a clock.
#
# A 747 flies open-loop through a modelled thunderstorm downburst (the
# documented composition; see the conditions strip). The chase camera's
# trigger is an EVENT on a telemetry channel: it captures once a second
# for as long as the recorded sink rate is below -10 m/s -- the
# downburst's outflow, well past anything still air does to a trimmed
# airliner (the still-air drift over this run is under 0.1 m/s).
# Deterministic: the downburst is a fixed field and the flight is
# seeded, so the same instants fire on every machine.
#
# Expected outcome: the manifest's frames all carry a recorded
# climb_rate_mps below -10, the schedule basis names the channel, and
# `flightsim.verify` passes. An event that never happens is a named
# refusal (camera.schedule: "... never goes below -10 ...") rather than
# an empty run: edit event_threshold to -30 to see it.
#
#   .venv/bin/python -m flightsim.capture \
#       examples/cameras_event_trigger.yaml --out runs/on_sink
#   .venv/bin/python -m flightsim.verify runs/on_sink
spec_version: 8
name: cameras_event_trigger
prompt: chase the 747 at 10000 ft through a thunderstorm for 60 seconds
aircraft:
  aircraft:
    value: B747
    source: user
    from: '747'
initial:
  altitude:
    value: 3048.0
    unit: m
    source: user
    from: 10000 ft
  airspeed:
    value: 250.0
    unit: kt
    source: default
    from: typical cruise for the B747
  airspeed_kind:
    value: cas
    source: default
  heading:
    value: 0.0
    unit: deg
    source: default
    from: due north
  latitude:
    value: 0.0
    unit: deg
    source: default
    from: equator; no geography requested
  longitude:
    value: 0.0
    unit: deg
    source: default
    from: prime meridian
  terrain_elevation:
    value: 0.0
    unit: m
    source: default
    from: flat terrain at sea level
environment:
  wind_speed:
    value: 0.0
    unit: kt
    source: default
    from: still air
  wind_direction:
    value: 0.0
    unit: deg
    source: default
    from: still air
  turbulence:
    value: none
    source: default
    from: smooth air
    std: MIL-F-8785C Fig.7 (W20, wind speed at 20 ft AGL)
    W20_kt: 0.0
  surface:
    value: unspecified
    source: default
    from: no ground cover stated; no surface coupling
  weather_date:
    value: none
    source: default
    from: no date stated; spec wind as given
  weather_event:
    value: thunderstorm
    source: inferred
    from: severe weather 'thunderstorm', aim core (documented composition/model; see
      conditions strip)
    aim: core
run:
  duration:
    value: 60.0
    unit: s
    source: user
    from: for 60 seconds
  rate:
    value: 120.0
    unit: Hz
    source: default
    from: matches the UE plugin substep rate
  seed:
    value: 0
    unit: dimensionless
    source: default
    from: deterministic; no stochastic subsystem active yet
  mass_held:
    value: false
    source: default
    from: realistic fuel burn
  hold_state:
    value: false
    source: user
    from: 'open loop: the downburst is what the aircraft meets, uncorrected'
cameras:
- camera_id:
    value: chase_on_sink
    source: user
    from: documented camera id
  preset:
    value: chase
    source: inferred
    from: chase
  position_mode:
    value: offset
    source: default
    from: camera language in the prompt; documented camera default
  offset_forward_m:
    value: -110.0
    unit: m
    source: default
    from: per-airframe chase offset table
  offset_right_m:
    value: 0.0
    unit: m
    source: default
    from: per-airframe chase offset table
  offset_up_m:
    value: 12.0
    unit: m
    source: default
    from: per-airframe chase offset table
  position_north_m:
    value: 0.0
    unit: m
    source: default
    from: camera language in the prompt; documented camera default
  position_east_m:
    value: 0.0
    unit: m
    source: default
    from: camera language in the prompt; documented camera default
  position_lat_deg:
    value: 0.0
    unit: deg
    source: default
    from: camera language in the prompt; documented camera default
  position_lon_deg:
    value: 0.0
    unit: deg
    source: default
    from: camera language in the prompt; documented camera default
  position_alt_m:
    value: 0.0
    unit: m
    source: default
    from: camera language in the prompt; documented camera default
  aim_mode:
    value: aircraft
    source: default
    from: camera language in the prompt; documented camera default
  aim_north_m:
    value: 0.0
    unit: m
    source: default
    from: camera language in the prompt; documented camera default
  aim_east_m:
    value: 0.0
    unit: m
    source: default
    from: camera language in the prompt; documented camera default
  aim_alt_m:
    value: 0.0
    unit: m
    source: default
    from: camera language in the prompt; documented camera default
  aim_bearing_deg:
    value: 0.0
    unit: deg
    source: default
    from: camera language in the prompt; documented camera default
  aim_elevation_deg:
    value: 0.0
    unit: deg
    source: default
    from: camera language in the prompt; documented camera default
  focal_length_mm:
    value: 35.0
    unit: mm
    source: default
    from: camera language in the prompt; documented camera default
  sensor_width_mm:
    value: 36.0
    unit: mm
    source: default
    from: camera language in the prompt; documented camera default
  sensor_height_mm:
    value: 20.25
    unit: mm
    source: default
    from: camera language in the prompt; documented camera default
  width_px:
    value: 1280
    unit: px
    source: default
    from: camera language in the prompt; documented camera default
  height_px:
    value: 720
    unit: px
    source: default
    from: camera language in the prompt; documented camera default
  near_m:
    value: 0.1
    unit: m
    source: default
