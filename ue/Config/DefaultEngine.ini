[/Script/Engine.Engine]
; Fixed tick rate. The JSBSim plugin substeps at a pseudo-fixed 120 Hz and its
; own README says to set the game to a fixed tick rate as well; without this the
; substep accumulator is driven by a variable frame time and the run stops being
; reproducible.
bUseFixedFrameRate=True
FixedFrameRate=120.000000

[/Script/Engine.RendererSettings]
; Phase 2 Look lane, part 1 (docs/PHASE2_CONTRACTS.md section 10, brainstorm
; 9.6-9.7). Before this block the project had NO renderer settings: every
; Gate 6 number on record (docs/VALIDITY.md 2.13, macOS, UE 5.5) was measured
; on engine defaults. NOTHING below is measured yet: each switch changes the
; luminance the Gate 6 clauses were tuned on and each is a probe render
; against a control before its clause is re-pinned (NEXT.md gotcha 6, 7).
; The commandlet records these under render.json render_settings in a later
; Look-lane stage; until then a frame carries no record of them.
;
; Gate 6 clause each setting is expected to move (expected, not measured):
;   r.CustomDepth=3 ...................... none (label passes: per-instance
;                                         stencil ids, contracts 2.3)
;   r.DynamicGlobalIlluminationMethod=1 .. "peaks shadow the valley" becomes
;                                         a GI clause (sky + bounce, not a
;                                         flat ambient term); the vertex
;                                         palette calibration re-opens
;   r.ReflectionMethod=1 ................. same; snow/rock specular from the
;                                         sky, not the reflection-capture
;                                         default
;   r.GenerateMeshDistanceFields=True .... enables software Lumen for static
;                                         meshes; the Movable procedural
;                                         terrain has NO distance field until
;                                         the Landscape row lands
;   r.Shadow.Virtual.Enable=1 ............ "cloud shadow" / "airframe ground
;                                         shadow" without cascade seams; the
;                                         procedural terrain stays on CSM
;                                         (VALIDITY 2.13) until it is a
;                                         Landscape
;   r.Nanite.ProjectEnabled=True ......... project-level enable only; the
;                                         import pipeline keeps build_nanite
;                                         OFF per mesh (gotcha 5: the capture
;                                         drew the coarse fallback) -- so no
;                                         clause moves until that is re-probed
;                                         on 5.7
;   r.AntiAliasingMethod=4 (TSR) ......... the beauty pass default; every
;                                         label pass overrides it to none
;                                         per capture (contracts section 1),
;                                         so "edges" clauses on labels do
;                                         not move; beauty edge sharpness
;                                         does
;   r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
;                                         "exposure does not breathe": the
;                                         manual EV100 from cameras[].exposure
;                                         (spec 8) needs the physical range;
;                                         the -exposure-bias values on record
;                                         (9.5 / 10.5 / 11.0, gotcha 7) are
;                                         in the OLD range and are re-probed
;   r.Substrate=False .................... OFF: no material on this branch is
;                                         authored for Substrate (the two
;                                         vertex-colour materials and the
;                                         imagery material are legacy
;                                         BaseColor graphs from
;                                         scripts/ue_create_materials.py);
;                                         turning it on converts them at load
;                                         and re-opens the palette
;                                         calibration for no gain until a
;                                         Substrate material exists
r.CustomDepth=3
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=False
r.GenerateMeshDistanceFields=True
r.Shadow.Virtual.Enable=1
r.Nanite.ProjectEnabled=True
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.Substrate=False

