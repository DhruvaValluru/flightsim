<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3-D Viewer</title>
<style>
  :root { --bg:#050d08; --panel:#0a1a10; --line:#2c5a3b; --green:#8ef0a8; --dim:#82af91;
          --text:#d7f0dc; --lift:#8cf0a0; --weight:#e1cd78; --thrust:#78d7cd; --drag:#eb9682; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:13px/1.4 Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  header { display:flex; gap:1rem; align-items:center; padding:.5rem 1rem;
           border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header b { color:var(--green); }
  main { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:.8rem; padding:.8rem 1rem; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; } }
  .stage { position:relative; background:#000; border:1px solid var(--line); overflow:hidden; }
  #zoomer { position:relative; transform-origin:0 0; cursor:grab; }
  .stage img, .stage canvas { display:block; width:100%; height:auto; }
  .stage canvas { position:absolute; inset:0; }
  .stage .scene { position:absolute; inset:0; opacity:0; transition:opacity .2s; }
  aside { display:flex; flex-direction:column; gap:.6rem; }
  .box { background:var(--panel); border:1px solid var(--line); padding:.5rem .7rem; }
  .box h3 { margin:0 0 .4rem; font-size:.8rem; color:var(--green); letter-spacing:.05em; }
  .box label { display:block; cursor:pointer; }
  table { width:100%; border-collapse:collapse; }
  td { padding:1px 0; } td:first-child { color:var(--dim); padding-right:.6rem; white-space:nowrap; }
  .scrub { display:flex; gap:.6rem; align-items:center; padding:0 1rem .8rem; }
  .scrub input[type=range] { flex:1; accent-color:#6fd18f; }
  button { font:inherit; background:#0b1a10; color:var(--green); border:1px solid var(--line);
           border-radius:4px; padding:.25rem .7rem; cursor:pointer; }
  #tip { position:fixed; pointer-events:none; background:#071209ee; border:1px solid var(--line);
         padding:.35rem .5rem; display:none; z-index:5; max-width:320px; }
  .dim { color:var(--dim); }
</style>
</head>
<body>
<header><b>FLIGHTSIM 3-D VIEWER</b><span id="title" class="dim">loading…</span>
  <span class="dim" id="status"></span></header>
<main>
  <div>
    <div class="stage" id="stage"><div id="zoomer">
      <img id="frame" alt="rendered frame">
      <img id="scene" class="scene" alt="scene picture">
      <canvas id="cv"></canvas>
    </div></div>
    <div class="dim" style="margin-top:.3rem">scroll to zoom, drag to pan, double-click to reset</div>
  </div>
  <aside>
    <div class="box"><h3>LAYERS</h3>
      <label><input type="checkbox" data-layer="box" checked> 3-D box</label>
      <label><input type="checkbox" data-layer="arrows" checked> forces &amp; velocity</label>
      <label><input type="checkbox" data-layer="airflow" checked> airflow</label>
      <label><input type="checkbox" data-layer="labels" checked> labels</label>
      <label><input type="checkbox" data-layer="landmarks" checked> landmarks</label>
      <label><input type="checkbox" data-layer="path" checked> flight path &amp; drop line</label>
      <label><input type="checkbox" data-layer="horizon"> horizon</label>
      <label><input type="checkbox" data-layer="scene"> scene picture (contours, grid, rings)</label>
    </div>
    <div class="box"><h3>FORCES</h3><table id="forces"></table></div>
    <div class="box"><h3>FLIGHT STATE</h3><table id="state"></table></div>
    <div class="box dim" style="font-size:.75rem">Hover an arrow or a landmark for its numbers.
      Everything drawn comes from this frame's JSON (box3d/&lt;frame&gt;.json).</div>
  </aside>
</main>
<div class="scrub"><button id="play" type="button">play</button>
  <input type="range" id="slider" min="0" max="0" value="0"><span id="tlabel" class="dim"></span></div>
<div id="tip"></div>
<script>
const qs = new URLSearchParams(location.search);
const runId = qs.get("run"), cam = qs.get("camera");
const base = `/runs/${encodeURIComponent(runId)}/cameras/${encodeURIComponent(cam)}`;
const $ = id => document.getElementById(id);
const cache = new Map();
let frames = [], cur = null, data = null, hot = [], playing = false;
const layers = {};
document.querySelectorAll("[data-layer]").forEach(cb => {
  layers[cb.dataset.layer] = cb.checked;
  cb.addEventListener("change", () => { layers[cb.dataset.layer] = cb.checked; draw(); });
});

async function getFrame(index) {
  if (!cache.has(index)) {
    cache.set(index, fetch(`${base}/box3d/${index}.json`).then(r => {
      if (!r.ok) throw new Error(`frame ${index}: ${r.status}`); return r.json(); }));
  }
  return cache.get(index);
}

function rows(el, obj) {
  el.innerHTML = Object.entries(obj || {}).map(([k, v]) =>
    `<tr><td>${k}</td><td>${v}</td></tr>`).join("");
}

async function show(i) {
  const rec = frames[i]; if (!rec) return;
  cur = i;
  $("slider").value = i;
  $("tlabel").textContent = `frame ${String(rec.index).padStart(4, "0")}  t ${(+rec.t_s).toFixed(3)} s`;
  $("status").textContent = "computing…";
  const name = String(rec.file || "").split("/").pop();
  $("frame").src = `/runs/${encodeURIComponent(runId)}/frames/${encodeURIComponent(cam)}/${encodeURIComponent(name)}`;
  $("scene").src = layers.scene ? `${base}/box3d/${rec.index}/scene.png` : "";
  try { data = await getFrame(rec.index); } catch (e) { $("status").textContent = String(e); return; }
  if (cur !== i) return;
  $("status").textContent = "";
  rows($("forces"), (data.panels || {}).forces);
  rows($("state"), (data.panels || {}).flight_state);
  draw();
  if (frames[i + 1]) getFrame(frames[i + 1].index).catch(() => {});   // prefetch
}

function draw() {
  const img = $("frame"), cv = $("cv");
  const W = img.naturalWidth || 1280, H = img.naturalHeight || 720;
  cv.width = W; cv.height = H;
  $("scene").style.opacity = layers.scene ? 1 : 0;
  if (layers.scene && cur !== null && !$("scene").src.includes("/scene.png"))
    $("scene").src = `${base}/box3d/${frames[cur].index}/scene.png`;
  const g = cv.getContext("2d"); g.clearRect(0, 0, W, H);
  hot = [];
  if (!data) return;
  const det = (data.overlay || {}).detailed || {};
  const [gw, gh] = det.image_size_px || [W, H];
  const sx = W / gw, sy = H / gh, P = p => p && [p[0] * sx, p[1] * sy];
  const u = H / 720;
  const line = (a, b, col, w, alpha = 1, dash = null) => {
    if (!a || !b) return; g.globalAlpha = alpha; g.strokeStyle = col; g.lineWidth = w * u;
    g.setLineDash(dash ? dash.map(d => d * u) : []); g.beginPath(); g.moveTo(a[0], a[1]);
    g.lineTo(b[0], b[1]); g.stroke(); g.setLineDash([]); g.globalAlpha = 1; };
  const placed = [];
  const tag = (p, text, col) => {
    if (!p || !layers.labels) return; g.font = `${11 * u}px Menlo, Consolas, monospace`;
    const w = g.measureText(text).width + 10 * u, h = 15 * u;
    let x = Math.min(p[0] + 6 * u, W - w - 2), y = p[1] - h / 2;
    for (let n = 0; n < 40; n++) {          // step below anything already labelled
      const hit = placed.find(q => x < q[2] && x + w > q[0] && y < q[3] && y + h > q[1]);
      if (!hit) break; y = hit[3] + 2 * u; }
    placed.push([x, y, x + w, y + h]);
    if (Math.abs(y + h / 2 - p[1]) > 4 * u) line([p[0], p[1]], [x, y + h / 2], col, .8, .6);
    g.fillStyle = "rgba(5,16,10,.8)"; g.fillRect(x, y, w, h);
    g.fillStyle = col; g.fillRect(x, y, 2 * u, h);
    g.fillText(text, x + 5 * u, y + h / 2 + 4 * u); };
  const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
  for (const ac of det.aircraft || []) {
    const fl = ac.airflow;
    if (fl && layers.airflow) {
      const [lo, hi] = fl.colour_ramp.speed_ratio_range, ramp = fl.colour_ramp.colours_rgb_slow_to_fast;
      const col = r => { const t = Math.max(0, Math.min(1, (r - lo) / ((hi - lo) || 1))) * (ramp.length - 1);
        const i = Math.min(Math.floor(t), ramp.length - 2), f = t - i;
        return rgb(ramp[i].map((v, k) => Math.round(v + (ramp[i + 1][k] - v) * f))); };
      for (const ln of fl.lines) for (let i = 0; i + 1 < ln.points_px.length; i++)
        line(P(ln.points_px[i]), P(ln.points_px[i + 1]), col(ln.speed_ratio[i]), 1.1, .75);
    }
    if (layers.box) {
      const c = ac.corners_px.map(P);
      for (const [a, b] of ac.edges) line(c[a], c[b], "#6ee196", 1.2, .8);
      for (const [a, b] of ac.nose_face_edges) line(c[a], c[b], "#c8ffd2", 1.6, .9);
      for (const d of ac.dimension_labels || []) tag(P(d.at_px), d.text, "#82af91");
    }
    if (layers.arrows) for (const ar of ac.arrows || []) {
      const a = P(ar.from_px), b = P(ar.to_px), col = rgb(ar.colour_rgb);
      line(a, b, col, ar.dashed ? 1.6 : 2.4, 1, ar.dashed ? [7, 6] : null);
      if (a && b) { const L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, ux = (b[0] - a[0]) / L,
          uy = (b[1] - a[1]) / L, s = Math.min(13 * u, L * .4);
        g.fillStyle = col; g.beginPath(); g.moveTo(b[0], b[1]);
        g.lineTo(b[0] - ux * s - uy * s * .36, b[1] - uy * s + ux * s * .36);
        g.lineTo(b[0] - ux * s + uy * s * .36, b[1] - uy * s - ux * s * .36); g.fill();
        tag(b, ar.label, col);
        const f = ((data.flight_physics || {}).forces || {})[ar.force];
        hot.push({x: b[0], y: b[1], html: f
          ? `<b>${ar.force.toUpperCase()}</b> ${f.magnitude_kn} kN<br>body ${JSON.stringify(f.vector_body_n)} N<br>` +
            `NED ${JSON.stringify(f.vector_ned_n)} N<br><span class="dim">${f.source}</span>`
          : `<b>${ar.label}</b>`}); }
    }
  }
  const sc = data.scene_overlay || {};
  if (layers.horizon && sc.horizon) {
    const p = sc.horizon.polyline_px.map(P);
    for (let i = 0; i + 1 < p.length; i++) line(p[i], p[i + 1], "#d7f0dc", 1, .7, [10, 8]);
  }
  if (layers.path) {
    const fp = sc.flight_path;
    if (fp) { const pts = fp.points.map(q => P(q.px));
      for (let i = 0; i + 1 < pts.length; i++) line(pts[i], pts[i + 1], "#c8eb8c", 1.8, .95);
      for (const t of fp.ticks) tag(P(t.px), t.label, "#c8eb8c"); }
    const dl = sc.drop_line;
    if (dl) { line(P(dl.from_px), P(dl.to_px), "#96f5b4", 1.4, .9, [6, 6]);
      tag(P(dl.to_px), dl.label, "#96f5b4"); }
  }
  if (layers.landmarks) for (const lm of ((sc.landmarks || {}).named || []).slice(0, 10)) {
    const p = P(lm.at_px); g.fillStyle = "#ebf5eb"; g.beginPath();
    g.arc(p[0], p[1], 3 * u, 0, 7); g.fill(); tag([p[0], p[1] - 10 * u], lm.name, "#e1f0e4");
    hot.push({x: p[0], y: p[1], html: `<b>${lm.name}</b><br>${(lm.range_m / 1000).toFixed(2)} km away, ` +
      `visible top ${lm.visible_altitude_m} m<br><span class="dim">${lm.kind}; ${lm.lat}, ${lm.lon}</span>`});
  }
}

$("cv").addEventListener("mousemove", e => {
  const r = e.target.getBoundingClientRect(), kx = e.target.width / r.width;
  const x = (e.clientX - r.left) * kx, y = (e.clientY - r.top) * kx;
  const near = hot.find(h => Math.hypot(h.x - x, h.y - y) < 14 * kx);
  const tip = $("tip");
  if (near) { tip.innerHTML = near.html; tip.style.display = "block";
    tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY + 10) + "px"; }
  else tip.style.display = "none";
});
$("frame").addEventListener("load", draw);
// Zoom (wheel, about the cursor) and pan (drag); the overlay scales with it.
let zs = 1, zx = 0, zy = 0, drag = null;
const applyZoom = () => { $("zoomer").style.transform = `translate(${zx}px,${zy}px) scale(${zs})`; };
$("stage").addEventListener("wheel", e => {
  e.preventDefault();
  const r = $("stage").getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const ns = Math.max(1, Math.min(8, zs * (e.deltaY < 0 ? 1.2 : 1 / 1.2)));
  zx = mx - (mx - zx) * ns / zs; zy = my - (my - zy) * ns / zs; zs = ns;
  if (zs === 1) { zx = 0; zy = 0; }
  applyZoom();
}, {passive: false});
$("stage").addEventListener("mousedown", e => { drag = [e.clientX - zx, e.clientY - zy]; });
window.addEventListener("mouseup", () => { drag = null; });
window.addEventListener("mousemove", e => { if (drag && zs > 1) {
  zx = e.clientX - drag[0]; zy = e.clientY - drag[1]; applyZoom(); } });
$("stage").addEventListener("dblclick", () => { zs = 1; zx = 0; zy = 0; applyZoom(); });
$("slider").addEventListener("input", e => show(+e.target.value));
$("play").addEventListener("click", async () => {
  playing = !playing; $("play").textContent = playing ? "pause" : "play";
  while (playing) {
    const next = (cur + 1) % frames.length; await show(next);
    await new Promise(r => setTimeout(r, 120));
  }
});
(async () => {
  try {
    const m = await (await fetch(`${base}/manifest.json`)).json();
    frames = (m.frames || []).slice().sort((a, b) => a.t_s - b.t_s);
    $("title").textContent = `run ${runId} · ${cam} · ${frames.length} frame(s) · ${m.aircraft || ""}`;
    $("slider").max = Math.max(0, frames.length - 1);
    if (frames.length) show(0);
  } catch (e) { $("title").textContent = "could not read the camera: " + e; }
})();
</script>
</body>
</html>
